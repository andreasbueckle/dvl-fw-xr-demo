name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prebuild runs scripts/prepare-spotify.mjs to generate public/data/spotify.json
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
      # Serve index.html for unknown paths so client-side routes survive a reload
      - run: cp dist/dvl-fw-xr-demo/browser/index.html dist/dvl-fw-xr-demo/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dvl-fw-xr-demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
